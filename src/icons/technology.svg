<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="34" height="34" overflow="visible"><style>
@keyframes drip{0%{transform:translateY(0);opacity:1}80%{transform:translateY(22px);opacity:1}100%{transform:translateY(26px);opacity:0}}
@keyframes jitter{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,0)}75%{transform:translate(-2px,0)}}
.jit{animation:jitter .3s linear infinite}
.d1{animation:drip 1.2s linear infinite;transform-box:fill-box}
.d2{animation:drip 1.2s linear infinite .6s;transform-box:fill-box}
@media (prefers-reduced-motion:reduce){.jit,.d1,.d2{animation:none}}
