<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="34" height="34" overflow="visible" aria-hidden="true"><style>
@keyframes a-leak{0%,15%{transform:scale(1) rotate(0)}35%{transform:scale(.92,.86) rotate(-6deg)}55%{transform:scale(.78,.68) rotate(5deg)}75%,90%{transform:scale(.62,.5) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
@keyframes a-str{0%,15%{transform:rotate(0)}75%,90%{transform:rotate(28deg)}100%{transform:rotate(0)}}
@keyframes a-wrinkle{0%,30%{opacity:0}60%,90%{opacity:1}96%,100%{opacity:0}}
@keyframes a-shine{0%,20%{opacity:1}60%,92%{opacity:0}100%{opacity:1}}
@keyframes a-puff{0%{transform:translate(0,0) scale(.4);opacity:0}4%{opacity:1}20%{transform:translate(-9px,5px) scale(1.3);opacity:0}100%{opacity:0}}
.a-b{transform-box:view-box;transform-origin:16px 28px;animation:a-leak 3.6s ease-in-out infinite}
.a-s{transform-box:view-box;transform-origin:16px 28px;animation:a-str 3.6s ease-in-out infinite}
.a-w{animation:a-wrinkle 3.6s ease-in-out infinite}
.a-h{animation:a-shine 3.6s ease-in-out infinite}
.a-p{transform-box:view-box;transform-origin:15px 29px;animation:a-puff 3.6s ease-out infinite both}
.a-p2{animation-delay:.75s}.a-p3{animation-delay:1.5s}.a-p1{animation-delay:.1s}

@media (prefers-reduced-motion:reduce){.a-b,.a-s,.a-w,.a-h,.a-p,.b-pin,.b-b,.b-s,.b-x,.c-g,.c-h{animation:none}.a-p,.a-w,.b-x,.b-pin{opacity:0}}</style><g class="a-s"><path d="M16 28l-2 10" stroke="#2B2320" stroke-width="2"/></g><g class="a-b"><path d="M10 26c-6-6-4-16 6-17 8-1 14 6 12 13-1 5-6 7-12 6z" fill="#E36C8A" stroke="#2B2320" stroke-width="2.5"/><g class="a-h"><path d="M14 13l3 3" stroke="#fff" stroke-width="2"/></g><path class="a-w" d="M11.5 19.5l2 1.5 2-1.2 2 1M20 12.5l1 2 2-.3" stroke="#2B2320" stroke-width="1.5" fill="none" stroke-linecap="round"/></g><circle class="a-p a-p1" cx="15" cy="29" r="1.8" fill="#fff" stroke="#2B2320" stroke-width="1.2"/><circle class="a-p a-p2" cx="15" cy="29" r="1.5" fill="#fff" stroke="#2B2320" stroke-width="1.2"/><circle class="a-p a-p3" cx="15" cy="29" r="1.2" fill="#fff" stroke="#2B2320" stroke-width="1.2"/></svg>