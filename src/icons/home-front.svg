@keyframes h1-sag{0%{transform:scale(1,1) skewX(0)}74%{transform:scale(1,1) skewX(0)}80%{transform:scale(1,.96) skewX(-3deg)}92%{transform:scale(1,.96) skewX(-3deg)}96%{transform:scale(1,1.03) skewX(1deg)}100%{transform:scale(1,1) skewX(0)}}
