@keyframes h1-chim{0%{transform:rotate(0)}48%{transform:rotate(0)}52%{transform:rotate(16deg)}54%{transform:rotate(11deg)}56%{transform:rotate(14deg)}92%{transform:rotate(14deg)}97%{transform:rotate(0)}100%{transform:rotate(0)}}
