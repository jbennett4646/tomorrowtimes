<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="34" height="34" aria-hidden="true"><style>@keyframes h1-shut{0%{transform:rotate(0)}16%{transform:rotate(0)}20%{transform:rotate(18deg)}23%{transform:rotate(-6deg)}26%{transform:rotate(14deg)}30%{transform:translate(0,0) rotate(14deg)}38%{transform:translate(6px,21px) rotate(95deg)}90%{transform:translate(6px,21px) rotate(95deg);opacity:1}93%{transform:translate(6px,21px) rotate(95deg);opacity:0}94%{transform:rotate(0);opacity:0}100%{transform:rotate(0);opacity:1}}
