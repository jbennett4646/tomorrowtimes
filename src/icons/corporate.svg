<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="34" height="34" aria-hidden="true"><style>
@keyframes m-fall{0%{transform:translate(0,-10px) rotate(-20deg);opacity:0}8%{opacity:1}30%{transform:translate(4px,20px) rotate(18deg)}55%{transform:translate(-4px,50px) rotate(-16deg)}82%{transform:translate(3px,80px) rotate(12deg);opacity:1}100%{transform:translate(0,104px) rotate(-8deg);opacity:0}}
@keyframes m-wl{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes m-wr{0%,100%{transform:rotate(0)}50%{transform:rotate(10deg)}}
.m-b{transform-box:fill-box;transform-origin:center;animation:m-fall 2.4s linear infinite}
.m-b1{animation-delay:0s}.m-b2{animation-delay:-.6s}.m-b3{animation-delay:-1.2s}.m-b4{animation-delay:-1.8s}.m-b5{animation-delay:-.9s}
.m-al{transform-box:view-box;transform-origin:42px 52px;animation:m-wl .6s ease-in-out infinite}
.m-ar{transform-box:view-box;transform-origin:58px 52px;animation:m-wr .6s ease-in-out infinite .3s}

@media (prefers-reduced-motion:reduce){.m-b,.m-al,.m-ar,.j-g,.j-sh,.j-b,.j-pile,.c-cloud,.c-d,.c-al,.c-ar{animation:none}}</style><g class="m-b m-b2"><g transform="translate(34 0)"><rect x="-8" y="-4.5" width="16" height="9" rx="1" fill="#8DC46B" stroke="#2B2320" stroke-width="2"/><circle r="2.3" fill="#4E8B3A"/></g></g><g class="m-b m-b4"><g transform="translate(66 0)"><rect x="-8" y="-4.5" width="16" height="9" rx="1" fill="#8DC46B" stroke="#2B2320" stroke-width="2"/><circle r="2.3" fill="#4E8B3A"/></g></g><g class=""><path d="M45 74l-3 18M55 74l3 18" stroke="#3A3F55" stroke-width="8" stroke-linecap="round"/><path d="M37 93h9M54 93h9" stroke="#2B2320" stroke-width="5" stroke-linecap="round"/><g class="m-al"><path d="M42 52L27 27" stroke="#3A3F55" stroke-width="8" stroke-linecap="round"/><circle cx="26" cy="24" r="5.5" fill="#F1C7A1" stroke="#2B2320" stroke-width="2.5"/></g><g class="m-ar"><path d="M58 52L73 27" stroke="#3A3F55" stroke-width="8" stroke-linecap="round"/><circle cx="74" cy="24" r="5.5" fill="#F1C7A1" stroke="#2B2320" stroke-width="2.5"/></g><rect x="38" y="47" width="24" height="30" rx="4" fill="#3A3F55" stroke="#2B2320" stroke-width="3"/><path d="M44 47l6 8 6-8z" fill="#fff"/><path d="M50 53l-2.5 3 2.5 13 2.5-13z" fill="#E36C8A" stroke="#2B2320" stroke-width="1"/><circle cx="50" cy="36" r="11" fill="#F1C7A1" stroke="#2B2320" stroke-width="3"/><path d="M44 33.5l2-2 2 2M52 33.5l2-2 2 2" stroke="#2B2320" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M44.5 38.5q5.5 6 11 0z" fill="#2B2320"/></g><g class="m-b m-b1"><g transform="translate(14 0)"><rect x="-8" y="-4.5" width="16" height="9" rx="1" fill="#8DC46B" stroke="#2B2320" stroke-width="2"/><circle r="2.3" fill="#4E8B3A"/></g></g><g class="m-b m-b3"><g transform="translate(86 0)"><rect x="-8" y="-4.5" width="16" height="9" rx="1" fill="#8DC46B" stroke="#2B2320" stroke-width="2"/><circle r="2.3" fill="#4E8B3A"/></g></g><g class="m-b m-b5"><g transform="translate(50 0)"><rect x="-8" y="-4.5" width="16" height="9" rx="1" fill="#8DC46B" stroke="#2B2320" stroke-width="2"/><circle r="2.3" fill="#4E8B3A"/></g></g></svg>